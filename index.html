<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Test Page - Index</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
            box-sizing: border-box;
        }

        .boring-box {
            background: white;
            padding: 30px;
            border-radius: 5px;
            border: 1px solid #ccc;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .boring-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 15px;
        }

        .adventure-box {
            background-color: #5bc8af;
            border: 6px solid #f7f48b;
            border-radius: 20px;
            padding: 25px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 0 #3a8a77;
            font-family: 'Press+Start+2P', monospace;
            text-align: center;
            color: #2e2e2e;
            position: relative;
        }

        .screen {
            background-color: #fffaf0;
            border: 4px solid #f45d48;
            border-radius: 12px;
            padding: 20px;
            font-size: 0.8rem;
            line-height: 1.8;
            color: #2e2e2e;
        }

        h1 {
            color: #f45d48;
            font-size: 1.3rem;
            margin-top: 0;
            text-shadow: 2px 2px 0 #f7f48b;
        }

        .hearts {
            font-size: 2rem;
            margin: 10px 0;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.15); }
        }

        .counter-box {
            background-color: #f7f48b;
            color: #f45d48;
            border: 3px dashed #f45d48;
            padding: 10px;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .dialogue {
            margin-top: 15px;
            background-color: #f45d48;
            border: 3px solid #5bc8af;
            padding: 10px;
            border-radius: 8px;
            color: #fff;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .pdf-btn {
            display: inline-block;
            margin-top: 20px;
            background-color: #f45d48;
            color: #fff;
            padding: 12px 18px;
            border-radius: 8px;
            font-family: 'Press+Start+2P', monospace;
            font-size: 0.7rem;
            text-decoration: none;
            box-shadow: 0 4px 0 #b33827;
        }

        .pdf-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #b33827;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="boring-box" id="screen1">
        <h2 style="font-family: monospace; color: #555;"> probando </h2>
        <p style="color: #666; font-size: 0.9rem;">Pag de prueba jeje. bai.</p>
        <button class="boring-btn" onclick="revealSurprise()">Pulsa aquí</button>
    </div>

    <div class="adventure-box hidden" id="screen2">
        <div class="screen">
            <h1> boniiii</h1>
            <div class="hearts">🖤🖤🖤</div>

            <div class="counter-box" id="counter">cargando...</div>

            <p>ola hermosa, como soy pobre recurro a esto.</p>
            <p>feliz 2do mes mi bonita!! la veda toy demasiado feliz y orgullosa k seas mi novia.</p>
            
            <div class="dialogue">
                eres mi cabecita chucha rasca huele mas pechocha, teamo
            </div>
            
            <!-- Cambia 'carta.pdf' por el nombre exacto de tu archivo PDF cuando lo subas a GitHub -->
            <a href="carta.pdf" class="pdf-btn" target="_blank">VER CARTA :)</a>
        </div>
    </div>

    <script>
        function revealSurprise() {
            document.getElementById('screen1').classList.add('hidden');
            document.getElementById('screen2').classList.remove('hidden');

            const startDate = new Date('2025-01-14');
            const today = new Date();
            const diffTime = Math.abs(today - startDate);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            document.getElementById('counter').innerText = `Día ${diffDays} tiempo soportando mis olores `;
        }
    </script>

</body>
</html>
